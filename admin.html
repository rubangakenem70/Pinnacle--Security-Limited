<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Pinnacle Security</title>
<link rel="stylesheet" href="style.css">
<style>
.admin-wrap{max-width:1100px;margin:20px auto;padding:0 15px}
.login-box{max-width:400px;margin:60px auto;background:white;padding:30px;border-radius:12px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.tab-btn{background:white;border:1px solid #ddd;padding:10px 15px;border-radius:999px;cursor:pointer;font-weight:700}
.tab-btn.active{background:#0a1a2f;color:white}
.tab-btn .count{background:#f9c300;color:#0a1a2f;padding:2px 8px;border-radius:10px;margin-left:5px;font-size:12px}
table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden;font-size:13px}
th{background:#0a1a2f;color:white;padding:12px;text-align:left}
td{padding:11px;border-bottom:1px solid #eee;vertical-align:top}
.badge-urgent{background:#f8d7da;color:#721c24;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700}
.btn-small{background:#e63946;color:white;border:none;padding:7px 11px;border-radius:7px;cursor:pointer;margin:2px}
.btn-green{background:#28a745;color:white;border:none;padding:8px 12px;border-radius:7px;cursor:pointer;font-weight:700}
.btn-wa{background:#25D366;color:white;border:none;padding:7px 11px;border-radius:7px;cursor:pointer;font-weight:700}
.btn-mail{background:#007bff;color:white;border:none;padding:7px 11px;border-radius:7px;cursor:pointer}
.pag{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}
.pag button{padding:7px 12px;border:1px solid #ddd;background:white;border-radius:6px;cursor:pointer;font-weight:700}
.pag button.active{background:#0a1a2f;color:white}
.debug{font-size:12px;color:#e63946;background:#fff0f0;padding:8px;border-radius:8px;margin:10px 0;display:none}
</style></head><body>
<header><h1>PINNACLE <span>SECURITY LTD</span></h1><p>Admin Dashboard - Bukasa, Makindye</p></header>
<div id="loginBox" class="login-box"><h2>🔐 Admin Login</h2>
<label style="text-align:left;">Username</label>
<input id="u" placeholder="admin">
<label style="text-align:left;">Password</label>
<input id="p" type="password" placeholder="••••••">
<button class="btn" onclick="login()">LOGIN</button>
<p style="font-size:12px;color:#999;">Demo: <b>admin</b> / <b>pinnacle123</b></p>
<p id="err" style="color:red;display:none;">Wrong username or password!</p></div>
<div id="dash" class="admin-wrap" style="display:none;">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
<h2>Welcome Back, Admin 👋</h2>
<button class="btn-small" onclick="logout()">Logout</button></div>
<div id="debugBox" class="debug"></div>
<div class="tabs">
<button class="tab-btn active" onclick="showTab('clients',this)">📝 Clients <span class="count" id="cClients">0</span></button>
<button class="tab-btn" onclick="showTab('jobs',this)">💼 Jobs <span class="count" id="cJobs">0</span></button>
<button class="tab-btn" onclick="showTab('quotes',this)">💰 Quotes <span class="count" id="cQuotes">0</span></button>
<button class="tab-btn" onclick="showTab('incidents',this)">🚨 Incidents <span class="count" id="cIncidents">0</span></button>
<button class="tab-btn" onclick="showTab('feedback',this)">⭐ Feedback <span class="count" id="cFeedback">0</span></button>
<button class="tab-btn" onclick="showTab('contacts',this)">📞 Contacts <span class="count" id="cContact">0</span></button>
</div>
<div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
<input id="search" placeholder="🔍 Search..." oninput="page=1;render()" style="flex:1;">
<button class="btn-green" onclick="loadAll()">🔄 Refresh</button>
<button class="btn-green" onclick="exportCSV()">⬇ Export CSV</button>
<button class="btn-green" onclick="window.print()">📄 PDF</button></div>
<div id="tableBox"></div>
<div class="pag"><span>Show:</span>
<select id="perPage" onchange="page=1;render()" style="width:auto;">
<option value="5">5</option><option value="10" selected>10</option>
<option value="20">20</option><option value="100">All</option></select>
<span id="pagInfo"></span>
<button onclick="prevPage()">← Prev</button>
<span id="pagNums"></span>
<button onclick="nextPage()">Next →</button></div>
<div id="replyBox" class="card" style="display:none;">
<h2>Reply To Client</h2><p id="replyTo"></p><label>Your Reply</label>
<textarea id="replyMsg">Hello, thank you for contacting Pinnacle Security Ltd, Bukasa - Makindye. We have received your request. Our team will call you shortly.</textarea><br>
<button class="btn-wa" onclick="sendWA()">💬 WhatsApp</button>
<button class="btn-mail" onclick="sendEmail()">📧 Email</button>
<button class="btn-small" onclick="document.getElementById('replyBox').style.display='none'">Close</button></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCeuQ0URInzX38BTTeehH-yBLPNFw1BZE", authDomain: "pinnacle-security-limite-dd066.firebaseapp.com", projectId: "pinnacle-security-limite-dd066", storageBucket: "pinnacle-security-limite-dd066.firebasestorage.app", messagingSenderId: "903457477721", appId: "1:903457477721:web:5b9d77c7fa218a1bf88d48", measurementId: "G-XVFTYJMJXF" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let current='clients', page=1, replyPhone='';
let allData={clients:[],jobs:[],quotes:[],incidents:[],feedback:[],contacts:[]};

window.login=function(){
  if(document.getElementById('u').value==='admin' && document.getElementById('p').value==='pinnacle123'){
    localStorage.setItem('pinnacle_admin','yes');
    document.getElementById('loginBox').style.display='none';
    document.getElementById('dash').style.display='block';
    loadAll();
  } else { document.getElementById('err').style.display='block'; }
};
window.logout=function(){ localStorage.removeItem('pinnacle_admin'); location.reload(); };
window.showTab=function(t,btn){
  current=t; page=1;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); render();
};
if(localStorage.getItem('pinnacle_admin')==='yes'){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('dash').style.display='block';
  loadAll();
}
async function loadAll(){
  document.getElementById('debugBox').style.display='none';
  try{
    const snap = await getDocs(collection(db, "pinnacle_database"));
    let all = snap.docs.map(d=>({id:d.id, ...d.data()}));
    for(let k in allData) allData[k]=[];
    all.forEach(r=>{
      let t = (r.formType||'').toLowerCase();
      if(allData[t]) allData[t].push(r);
      else if(t==='client') allData.clients.push(r);
      else allData.clients.push(r);
    });
    for(let k in allData){ allData[k].sort((a,b)=> (b.date||'').localeCompare(a.date||'')); }
    if(all.length===0){
      document.getElementById('debugBox').textContent = "Firebase returned 0 docs. Check collection pinnacle_database";
      document.getElementById('debugBox').style.display='block';
    }
  }catch(e){
    document.getElementById('debugBox').textContent = "FIREBASE ERROR: "+e.message;
    document.getElementById('debugBox').style.display='block';
  }
  render();
}
window.loadAll=loadAll;
window.render=function(){
  let q=(document.getElementById('search').value||'').toLowerCase();
  document.getElementById('cClients').textContent=allData.clients.length;
  document.getElementById('cJobs').textContent=allData.jobs.length;
  document.getElementById('cQuotes').textContent=allData.quotes.length;
  document.getElementById('cIncidents').textContent=allData.incidents.length;
  document.getElementById('cFeedback').textContent=allData.feedback.length;
  document.getElementById('cContact').textContent=allData.contacts.length;
  let map={clients:{cols:['Name','Phone','Service','Location','Date']},jobs:{cols:['Name','Phone','Position','District','Date']},quotes:{cols:['Name','Phone','Service','Location','Date']},incidents:{cols:['Name','Phone','Type','Location','Date']},feedback:{cols:['Name','Rating','Message','Date']},contacts:{cols:['Name','Contact','Subject','Message','Date']}};
  let cur=map[current];
  let rows=allData[current].filter(r=>JSON.stringify(r).toLowerCase().includes(q));
  let per=parseInt(document.getElementById('perPage').value);
  let totalPages=Math.max(1,Math.ceil(rows.length/per));
  if(page>totalPages) page=totalPages;
  let start=(page-1)*per;
  let pageRows=rows.slice(start,start+per);
  document.getElementById('pagInfo').textContent='Showing '+(rows.length?start+1:0)+' - '+Math.min(start+per,rows.length)+' of '+rows.length;
  let nums=''; for(let i=1;i<=totalPages;i++){ nums+='<button class="'+(i===page?'active':'')+'" onclick="page='+i+';render()">'+i+'</button>'; }
  document.getElementById('pagNums').innerHTML=nums;
  if(rows.length===0){
    document.getElementById('tableBox').innerHTML='<div class="card"><p>No data yet in <b>pinnacle_database</b> where formType = <b>'+current+'</b>.</p><button class="btn" onclick="loadAll()">🔄 Refresh</button></div>';
    return;
  }
  let html='<table><tr>'+cur.cols.map(c=>'<th>'+c+'</th>').join('')+'<th>Action</th></tr>';
  pageRows.forEach((r)=>{
    html+='<tr>'+cur.cols.map(c=>{
      if(c==='Date') return '<td>'+(r.date||'')+'</td>';
      if(c==='Message') return '<td>'+(r.message||'')+'</td>';
      if(c==='Contact') return '<td>'+(r.contact||r.phone||'')+'</td>';
      if(c==='Rating') return '<td>'+(r.rating||'')+'</td>';
      if(c==='Service') return '<td>'+(r.service||'')+'</td>';
      if(c==='Position') return '<td>'+(r.position||'')+'</td>';
      if(c==='District') return '<td>'+(r.district||r.location||'')+'</td>';
      if(c==='Type') return '<td><span class="badge-urgent">'+(r.type||'')+'</span></td>';
      if(c==='Subject') return '<td>'+(r.subject||'')+'</td>';
      if(c==='Location') return '<td>'+(r.location||'')+'</td>';
      if(c==='Name') return '<td><b>'+(r.name||'')+'</b></td>';
      if(c==='Phone') return '<td>'+(r.phone||'')+'</td>';
      return '<td>'+(r[c.toLowerCase()]||'')+'</td>';
    }).join('')+'<td><button class="btn-wa" onclick="openReply(\''+(r.phone||'')+'\',\''+(r.name||'').replace(/\'/g,'')+'\')">💬 Reply</button> <button class="btn-small" onclick="delOne(\''+r.id+'\')">Delete</button></td></tr>';
  });
  html+='</table>';
  document.getElementById('tableBox').innerHTML=html;
};
window.prevPage=function(){ if(page>1){page--;render()} };
window.nextPage=function(){ page++; render(); };
window.openReply=function(ph,name){
  replyPhone=ph||'';
  document.getElementById('replyTo').textContent='To: '+(name||'')+' ('+replyPhone+')';
  document.getElementById('replyBox').style.display='block';
};
window.sendWA=function(){
  let m=encodeURIComponent(document.getElementById('replyMsg').value);
  window.open('https://wa.me/'+replyPhone.replace(/[^0-9]/g,'')+'?text='+m,'_blank');
};
window.sendEmail=function(){
  let s=encodeURIComponent('Reply from Pinnacle Security Ltd');
  let b=encodeURIComponent(document.getElementById('replyMsg').value);
  window.open('mailto:?subject='+s+'&body='+b,'_blank');
};
window.delOne=async function(id){
  if(confirm('Delete this entry?')){ await deleteDoc(doc(db,"pinnacle_database",id)); loadAll(); }
};
window.exportCSV=function(){
  let rows=allData[current];
  if(!rows.length){ alert('No data'); return; }
  let csv='data:text/csv;charset=utf-8,'+Object.keys(rows[0]).join(',')+'\n'+rows.map(r=>Object.values(r).map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  let a=document.createElement('a'); a.href=encodeURI(csv); a.download='pinnacle_'+current+'.csv'; a.click();
};
</script></body></html>
